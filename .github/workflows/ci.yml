name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plugin Hub builds against Java 11, and build.gradle targets release 11 - match it here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      # Also validates the committed gradle-wrapper.jar checksum.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
          retention-days: 7
